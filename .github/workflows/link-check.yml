name: Link Health Check

on:
  schedule:
    # UTC 21:00 = 北京时间每天 05:00
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run link check
        run: node tools/check-links.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_data/link-health.json
          if git diff --cached --quiet; then
            echo "巡检结果无变化，跳过提交"
          else
            git commit -m "chore: 友链巡检结果更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
